# Snakemake profile for the BGI SLURM cluster, with the cluster-generic executor
# plugin of sinproc.yml. Each job asks for the threads of its rule as cpus.
executor: cluster-generic
cluster-generic-submit-cmd: >-
  mkdir -p .snakemake/slurm_logs &&
  sbatch --parsable --partition=big --cpus-per-task={threads}
  --mem={resources.mem_mb}M --time={resources.runtime}
  --job-name=smk-{rule} --output=.snakemake/slurm_logs/{rule}-%j.out
# run_workflow.sh limits the cpus of the running jobs with --resources cpus=N;
# jobs only bounds the number of jobs on top of that
jobs: 200
latency-wait: 60
rerun-incomplete: true
default-resources:
  mem_mb: 32000
  runtime: 1440
  cpus: 1
