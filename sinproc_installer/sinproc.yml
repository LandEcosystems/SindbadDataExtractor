name: sinproc
channels:
  - conda-forge
  - nodefaults
  - bioconda
dependencies:
  # The versions that fluxcom is tested with, from its environment_313.yml.
  - python=3.13
  - numpy=2.3
  - scipy=1.17
  - xarray=2025.12.0
  - pandas=3.0
  - dask=2026.1.2
  - zarr=2.18
  - netcdf4=1.7.4
  - pyyaml=6.0.3
  - threadpoolctl=3.6.0
  - sympy=1.14.0
  - statsmodels=0.14.6
  - bottleneck=1.6.0
  - jsonpickle=4.1.1
  - numba=0.63.1
  - scikit-learn=1.8.0
  - fasteners=0.19
  - snakemake-minimal=9.27
  - snakemake-executor-plugin-cluster-generic
  # The remote products of prefetch.py.
  - h5netcdf
  - fsspec
  - aiohttp
  - requests
  - rasterio
  - shapely
  - geopandas
  - timezonefinder
  - tqdm
  # PyCLIFF.
  - h5py
  - joblib
  - tabulate
  - pyarrow
  - matplotlib
  - pytest
  - pip
  - pip:
    - loess==2.1.2
    - git+https://github.com/fluxnet/shuttle.git@028818791fef116db03e97f3f6b0aebdf1a89e90
    - git+https://github.com/epsilon-machine/missingpy.git@0b526a7314dc3cc47f708702765b7aed1b55d4ab
